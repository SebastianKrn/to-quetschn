name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate skills
        run: pnpm validate:skills

      - name: Validate memory format
        run: pnpm validate:memory

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Benchmark (strict)
        run: pnpm benchmark --strict --json .artifacts/benchmark-summary.json

      - name: Install Playwright Chromium
        run: pnpm --filter @grifftab/web exec playwright install --with-deps chromium

      - name: MVP local scenario smoke (advisory)
        run: pnpm mvp:scenario
        continue-on-error: true

      - name: Upload benchmark summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-summary
          path: .artifacts/benchmark-summary.json
          if-no-files-found: ignore

      - name: Upload MVP scenario artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp-scenario-artifacts
          path: |
            .artifacts/mvp-scenario-summary.json
            .artifacts/mvp/*.log
          if-no-files-found: ignore
