services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      PILOT_MODE: "true"
      ENFORCE_UPLOAD_RIGHTS_CONFIRMATION: "true"
      APP_BASE_URL: http://localhost:3000
      FEATURE_PUBLIC_SHARING: "false"
      FEATURE_TRANSPOSE_SUGGESTIONS: "true"
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: pilot-local-better-auth-secret-please-change-123456
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql://grifftab:grifftab@postgres:5432/grifftab
      CONVEX_DEPLOYMENT: local-dev
      CONVEX_URL: http://127.0.0.1:3210
      CONVEX_ADMIN_KEY: pilot-local-convex-admin
      REDIS_URL: redis://redis:6379
      QUEUE_PREFIX: grifftab-pilot
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: grifftab-files-pilot
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      OMR_SERVICE_URL: http://omr-service:4100
      OMR_MODE: audiveris
      OMR_REPLAY_MANIFEST_PATH: benchmarks/replay-manifest.json
      AUDIVERIS_BIN: /usr/bin/audiveris
      AUDIVERIS_TIMEOUT_MS: 600000
      LOCAL_DOMAIN_STORE_PATH: /pilot-state/local-domain-store.json
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
      - minio
      - omr-service
      - worker
    volumes:
      - pilot-state:/pilot-state

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      NODE_ENV: production
      PILOT_MODE: "true"
      REDIS_URL: redis://redis:6379
      QUEUE_PREFIX: grifftab-pilot
      WORKER_CONCURRENCY: 2
      OMR_SERVICE_URL: http://omr-service:4100
      CONVEX_DEPLOYMENT: local-dev
      CONVEX_URL: http://127.0.0.1:3210
      CONVEX_ADMIN_KEY: pilot-local-convex-admin
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: grifftab-files-pilot
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      OMR_MODE: audiveris
      OMR_REPLAY_MANIFEST_PATH: benchmarks/replay-manifest.json
      AUDIVERIS_BIN: /usr/bin/audiveris
      AUDIVERIS_TIMEOUT_MS: 600000
      LOCAL_DOMAIN_STORE_PATH: /pilot-state/local-domain-store.json
      LOG_LEVEL: info
    depends_on:
      - redis
      - omr-service
      - minio
    volumes:
      - pilot-state:/pilot-state

  omr-service:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/omr-service/Dockerfile
    environment:
      NODE_ENV: production
      OMR_PORT: 4100
      OMR_PROVIDER: audiveris
      OMR_MODE: audiveris
      OMR_REPLAY_MANIFEST_PATH: benchmarks/replay-manifest.json
      AUDIVERIS_BIN: /usr/bin/audiveris
      AUDIVERIS_TIMEOUT_MS: 600000
      LOG_LEVEL: info
    ports:
      - "4100:4100"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: grifftab
      POSTGRES_USER: grifftab
      POSTGRES_PASSWORD: grifftab
    ports:
      - "5432:5432"
    volumes:
      - pilot-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - pilot-redis-data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - pilot-minio-data:/data

volumes:
  pilot-state:
  pilot-postgres-data:
  pilot-redis-data:
  pilot-minio-data:
